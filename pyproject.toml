[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-checker"
version = "0.1.0"
description = "Crash-resilient human-in-the-loop (HITL) quality checker and weak-learning pipeline for Turkish legal-reference annotations"
readme = "README.md"
authors = [
  { name = "Murat Karakaya Akademi", email = "info@muratkarakaya.net" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["nlp", "legal-tech", "ner", "human-in-the-loop", "data-quality", "weak-supervision", "mlx"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "Flask>=3.1,<4",
]

[project.optional-dependencies]
compute = [
  "huggingface-hub>=1.4",
  "mlx>=0.31.1",
  "mlx-lm>=0.31.0",
  "numpy>=2",
]
test = [
  "pytest>=9,<10",
  "pytest-cov>=4.1.0",
]
dev = [
  "ruff>=0.4.0",
  "mypy>=1.9.0",
  "build>=1.1.0",
]

[project.scripts]
dqcheck = "data_quality_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
  "compute: requires MLX and the pinned local model",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["data_quality_checker"]
